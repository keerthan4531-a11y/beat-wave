name: Build BeatWave APK

on:
  push:
    branches:
      - main
      - master
      - 'arena/**'
    paths-ignore:
      - '**.md'
      - 'Screenshot/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build BeatWave Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      ADDON_CLIENT_SECRET: ${{ secrets.ADDON_CLIENT_SECRET }}
      RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
      LASTWAVE_LYRICS_TOKEN: ${{ secrets.LASTWAVE_LYRICS_TOKEN }}
      LASTWAVE_LYRICS_URL: ${{ secrets.LASTWAVE_LYRICS_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Prepare Release Keystore Fallback
        id: keystore
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "Generating BeatWave signing keystore for CI release APK..."
            mkdir -p "$RUNNER_TEMP/signing"
            keytool -genkeypair \
              -v \
              -keystore "$RUNNER_TEMP/signing/beatwave.keystore" \
              -alias beatwave_key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass beatwave2026 \
              -keypass beatwave2026 \
              -dname "CN=BeatWave, OU=mokka coding, O=BeatWave, L=Chennai, ST=TN, C=IN"
            B64_KEY=$(base64 -w 0 "$RUNNER_TEMP/signing/beatwave.keystore")
            echo "::add-mask::$B64_KEY"
            echo "b64_key=$B64_KEY" >> "$GITHUB_OUTPUT"
            echo "store_pass=beatwave2026" >> "$GITHUB_OUTPUT"
            echo "key_alias=beatwave_key" >> "$GITHUB_OUTPUT"
            echo "key_pass=beatwave2026" >> "$GITHUB_OUTPUT"
          fi

      - name: Build BeatWave Release APK
        env:
          ADDON_CLIENT_SECRET: ${{ secrets.ADDON_CLIENT_SECRET }}
          LASTWAVE_LYRICS_TOKEN: ${{ secrets.LASTWAVE_LYRICS_TOKEN }}
          LASTWAVE_LYRICS_URL: ${{ secrets.LASTWAVE_LYRICS_URL }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY || steps.keystore.outputs.b64_key }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD || steps.keystore.outputs.store_pass }}
          RELEASE_KEY_ALIAS: ${{ secrets.ALIAS || secrets.RELEASE_KEY_ALIAS || steps.keystore.outputs.key_alias || 'release_key' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD || steps.keystore.outputs.key_pass }}
        run: |
          set +e
          ./gradlew assembleRelease --stacktrace 2>&1 | tee gradle_build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ "$BUILD_EXIT" -ne 0 ]; then
            grep -E "(^e: |FAILURE:|What went wrong|^> |Exception:|Error:)" gradle_build.log | head -n 40 | while IFS= read -r line; do
              clean_line=$(echo "$line" | tr -d '\r')
              echo "::error title=GradleCompile::$clean_line"
            done
            tail -n 35 gradle_build.log | while IFS= read -r line; do
              clean_line=$(echo "$line" | tr -d '\r')
              echo "::warning title=GradleTail::$clean_line"
            done
            exit "$BUILD_EXIT"
          fi

      - name: Stage Final APK
        id: prep_apk
        run: |
          mkdir -p final_apk
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then
            VERSION="5.0.0"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building APK for BeatWave v$VERSION"
          if [ -f "app/build/outputs/apk/release/app-release-signed.apk" ]; then
            cp app/build/outputs/apk/release/app-release-signed.apk final_apk/BeatWave-v${VERSION}-release.apk
          else
            cp app/build/outputs/apk/release/app-release.apk final_apk/BeatWave-v${VERSION}-release.apk
          fi
          ls -lh final_apk/

      - name: Verify APK signature + publish checksum
        run: |
          SDKROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(find "$SDKROOT/build-tools" -maxdepth 2 -name apksigner 2>/dev/null | head -n1)
          if [ -z "$APKSIGNER" ]; then
            echo "::warning::apksigner not found under $SDKROOT, skipping signature verification"
          else
            for apk in final_apk/*.apk; do
              echo "Verifying $apk ..."
              "$APKSIGNER" verify --print-certs "$apk" > /dev/null || { echo "::error::APK failed signature verification: $apk"; exit 1; }
            done
            echo "All APK signatures valid."
          fi
          (cd final_apk && sha256sum *.apk > SHA256SUMS.txt)
          cat final_apk/SHA256SUMS.txt

      - name: Upload BeatWave Release APK Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BeatWave-v${{ steps.prep_apk.outputs.version }}-APK
          path: final_apk/*
          if-no-files-found: error

      - name: Publish BeatWave Direct APK Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.prep_apk.outputs.version }}-beatwave"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" final_apk/* --clobber
          else
            gh release create "$TAG" final_apk/* \
              --target "${{ github.sha }}" \
              --title "BeatWave v${{ steps.prep_apk.outputs.version }} (Cyber Edition)" \
              --notes "BeatWave Cyber Acoustic Edition by mokka coding (@dark.shadow_4531). Includes Cyber Sound Lab & 432Hz Tuner, Listener Profile & Telemetry Hub, High-Animation Cyber About Screen, and First-Launch Cyber Onboarding."
          fi
